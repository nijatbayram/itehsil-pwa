
<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#064e3b">

  <title>iTƏHSİL — Mobil Tətbiq</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100dvh;
      font-family: Arial, sans-serif;
      background: linear-gradient(145deg, #064e3b, #0f172a);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 96px;
      height: 96px;
      margin: 0 auto 24px;
      border-radius: 26px;
      background: linear-gradient(135deg, #00e676, #00bcd4);
      color: #06291d;
      font-size: 38px;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    h1 {
      font-size: 38px;
      margin: 0 0 12px;
    }

    p {
      color: #cbd5e1;
      line-height: 1.7;
      font-size: 16px;
    }

    .status {
      display: inline-block;
      margin-top: 24px;
      padding: 12px 18px;
      background: rgba(255,255,255,.1);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 14px;
      font-size: 14px;
    }

    .note {
      margin-top: 28px;
      font-size: 12px;
      color: #94a3b8;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">iT</div>

    <h1>iTƏHSİL</h1>

    <p>
      Elektron Jurnal İdarəetmə Platforması
    </p>

    <div class="status">
      Mobil tətbiqin sınaq versiyası
    </div>

    <div class="note">
      © 2026 iTƏHSİL
    </div>
  </main>
</body>
</html>
